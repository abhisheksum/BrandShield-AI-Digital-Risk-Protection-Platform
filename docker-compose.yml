services:
  api:
    build:
      context: ./backend
    environment:
      PROJECT_NAME: "Rakshak — Digital Brand Protection"
      SECRET_KEY: ${SECRET_KEY:?Set a stable random SECRET_KEY in the root .env file}
      DATABASE_URL: sqlite:////data/rakshak.db
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      APPLE_STORE_COUNTRY: ${APPLE_STORE_COUNTRY:-us}
      APPLE_STORE_RESULT_LIMIT: ${APPLE_STORE_RESULT_LIMIT:-25}
      APPLE_STORE_TIMEOUT_SECONDS: ${APPLE_STORE_TIMEOUT_SECONDS:-6}
      WEIGHT_NAME_SIMILARITY: ${WEIGHT_NAME_SIMILARITY:-0.30}
      WEIGHT_LOGO_SIMILARITY: ${WEIGHT_LOGO_SIMILARITY:-0.25}
      WEIGHT_DESCRIPTION_SIMILARITY: ${WEIGHT_DESCRIPTION_SIMILARITY:-0.20}
      WEIGHT_PUBLISHER_MISMATCH: ${WEIGHT_PUBLISHER_MISMATCH:-0.15}
      WEIGHT_SUSPICIOUS_BEHAVIOR: ${WEIGHT_SUSPICIOUS_BEHAVIOR:-0.10}
      ALERT_RISK_THRESHOLD: ${ALERT_RISK_THRESHOLD:-40}
      MEDIUM_RISK_THRESHOLD: ${MEDIUM_RISK_THRESHOLD:-45}
      HIGH_RISK_THRESHOLD: ${HIGH_RISK_THRESHOLD:-65}
      CRITICAL_RISK_THRESHOLD: ${CRITICAL_RISK_THRESHOLD:-80}
    volumes:
      - rakshak_data:/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  rakshak_data:
